<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Currents</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="description" content="%%DESCRIPTION%%" />
    <link rel="canonical" href="%%SITE%%/" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/%%ICON32%%" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/%%ICON180%%" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#e8283b" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Currents" />
    <meta property="og:title" content="Currents" />
    <meta property="og:description" content="%%DESCRIPTION%%" />
    <meta property="og:url" content="%%SITE%%/" />
    <meta property="og:image" content="%%SITE%%/assets/%%OG%%" />
    <meta property="og:image:secure_url" content="%%SITE%%/assets/%%OG%%" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%%IMAGE_ALT%%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Currents" />
    <meta name="twitter:description" content="%%DESCRIPTION%%" />
    <meta name="twitter:image" content="%%SITE%%/assets/%%OG%%" />
    <meta name="twitter:image:alt" content="%%IMAGE_ALT%%" />
%%PRELOAD%%
    <link rel="stylesheet" href="assets/%%CSS%%" />
    <script defer src="assets/%%JS%%"></script>
    <script type="application/json" id="manifest">%%MANIFEST%%</script>
  </head>
  <body>
    <div id="screen" data-phase="loading">
      <div class="panel">
        <h1>Currents</h1>
        <p id="screen-status" aria-live="polite">Loading</p>
        <progress id="screen-progress" max="1" value="0" hidden></progress>
        <div id="screen-failure" role="alert" hidden>
          <p id="failure-summary"></p>
          <ul id="failure-list"></ul>
          <div id="failure-actions" class="actions"></div>
          <details>
            <summary>Details</summary>
            <pre id="failure-details"></pre>
          </details>
        </div>
        <noscript><p>This page needs JavaScript and WebAssembly.</p></noscript>
      </div>
    </div>
  </body>
</html>
