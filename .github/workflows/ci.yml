name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Full debuginfo across the test binaries is slow to link and fills the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  quality:
    name: Format, check and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml is the single source of truth for the version and its targets.
      - name: Read pinned toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      # The Windows lint builds the target's build scripts, which want the mingw linker.
      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mingw-w64

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - run: just fmt-check
      - run: just check
      - run: just lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner has no GPU; Mesa's lavapipe runs the GPU tests on the CPU through Vulkan,
      # which llvmpipe's OpenGL would otherwise be picked over.
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Install lavapipe
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest

      - run: just test

  windows:
    name: Windows build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Install mingw-w64
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mingw-w64

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - run: just windows

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: currents-windows
          path: target/x86_64-pc-windows-gnu/release/currents.exe
          if-no-files-found: error
