[workspace]
members = ["crates/*"]
default-members = ["crates/native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
assert2 = "0.4.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
image = "0.25.10"
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
pollster = "1.0.1"
rstest = "0.28.0"
snafu = "0.9.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }
winit = "0.30.13"

currents-core = { path = "crates/core", default-features = false }

[workspace.lints.rust]
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
redundant_lifetimes = "warn"
meta_variable_misuse = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

must_use_candidate = "allow"

# The typed snafu enum is the documentation.
missing_errors_doc = "allow"

# A panic here is an invariant violation, not a documented contract.
missing_panics_doc = "allow"

# Noisy, and it fights builders that later gain a body.
missing_const_for_fn = "allow"

option_if_let_else = "allow"
redundant_pub_crate = "allow"

# Pixel sizes and cover coordinates move between u32 and f32 constantly; every cast is bounded by the image size.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

# wgpu descriptors take `Default::default()`; the type name adds nothing.
default_trait_access = "allow"

# A fused multiply-add rounds differently, which would shift rendered pixels.
suboptimal_flops = "allow"

# Dependencies are never rebuilt, and an unoptimised PNG encoder is unusably slow.
[profile.dev.package."*"]
opt-level = 2

# Release speed with symbols, so `perf` can attribute samples to a function.
[profile.profiling]
inherits = "release"
debug = 1

# The browser bundles: small over fast, since the shaders do the work.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
