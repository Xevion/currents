[package]
name = "currents-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["native-backends"]
native-backends = ["wgpu/vulkan", "wgpu/gles", "wgpu/dx12", "wgpu/metal"]
webgpu = ["wgpu/webgpu"]
webgl = ["wgpu/webgl"]

[dependencies]
bytemuck.workspace = true
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
snafu.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
toml_edit = { version = "0.25.19", features = ["serde"] }
tracing.workspace = true
web-time = "1.1.0"
wgpu.workspace = true
winit = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.37", default-features = false, features = ["x11", "wayland", "clipboard"] }
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-winit = { version = "0.37", default-features = false }
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["HtmlCanvasElement"] }

[dev-dependencies]
assert2.workspace = true
egui_kittest = "0.37"
naga = { workspace = true, features = ["glsl-out"] }
rstest.workspace = true

[lints]
workspace = true
