[package]
name = "currents"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
currents-core = { workspace = true, features = ["native-backends"] }
dirs = "7.0.0"
image.workspace = true
open = "5.4.5"
pollster.workspace = true
rayon = "1.12.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
snafu.workspace = true
strum = { version = "0.28.0", features = ["derive"] }
toml_edit = "0.25.19"
tracing.workspace = true
tracing-subscriber.workspace = true
webpx = { version = "0.4.1", features = ["animation"] }
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
assert2.workspace = true
divan = "0.1.21"
rstest.workspace = true

[[bench]]
name = "export"
harness = false

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
