[package]
name = "currents-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["webgpu", "webgl"]
webgpu = ["currents-core/webgpu"]
webgl = ["currents-core/webgl"]

[dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
currents-core.workspace = true
js-sys = "0.3.107"
log = "0.4.35"
tracing = { workspace = true, features = ["log"] }
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3.107", features = ["Window", "Location", "UrlSearchParams", "HtmlCanvasElement"] }

[lints]
workspace = true
